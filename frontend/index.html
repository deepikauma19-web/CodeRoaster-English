<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta property="og:url" content="https://roaster.getvibed.tech/" />

      property="og:description"
      content="Paste a public GitHub repo and get an honest (and spicy) roast, a score out of 100 and tips to improve your code."
    />

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Code Roaster: a cartoon presenter next to the tagline 'We roast your code, you improve it!'" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Code Roaster 🔥 — your GitHub repo, roasted in English" />

      name="twitter:description"
      content="Paste a public GitHub repo and get an honest (and spicy) roast, a score out of 100 and tips to improve your code."

      rel="stylesheet"
    />
    <title>Code Roaster 🔥</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
