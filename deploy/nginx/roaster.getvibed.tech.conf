# Host nginx site for Code Roaster
# Installed to /etc/nginx/sites-available/roaster.getvibed.tech.conf by deploy/enable-ssl.sh.
#
# Stage 1 (no certificate yet): this file only has a port-80 server, so `nginx -t`
# passes and certbot's http-01 challenge works.
# Stage 2: `certbot --nginx --redirect` edits this file in place, adding the 443/TLS
# listener + certificate paths and turning port 80 into a redirect to https.
#
# Same-origin routing:
#   /api/*, /health  -> backend  (127.0.0.1:8000)
#   everything else  -> frontend (127.0.0.1:3000, SPA served by nginx in the container)

upstream roaster_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream roaster_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HSTS only over https (empty value => header not sent on plain http).
map $scheme $roaster_hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    listen [::]:80;
    server_name roaster.getvibed.tech;

    server_tokens off;
    client_max_body_size 1m;

    # Compression (text/html is always compressed when gzip is on)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml font/woff2;

    # Security headers (set once here; upstream copies are hidden to avoid duplicates).
    # Do not add add_header inside location blocks or these stop being inherited.
    add_header Strict-Transport-Security $roaster_hsts always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;

    # Common proxy settings
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (not append) so clients cannot spoof their IP to bypass rate limits.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;   # AI analysis requests can take a while

    location /api/ {
        proxy_pass http://roaster_backend;
    }

    location = /health {
        proxy_pass http://roaster_backend;
        access_log off;
    }

    location / {
        proxy_pass http://roaster_frontend;
    }
}
